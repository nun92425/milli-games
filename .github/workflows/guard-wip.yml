name: guard-wip

on:
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check WIP files not leaked to main
        run: |
          echo "Checking for WIP files in PR diff..."
          # WIP files that must not appear on main
          WIP_FILES=(
            "games/milikara.html"
            "games/milli-fortune.html"
            "games/miri-kore.html"
            "images/games/icon/milikara-icon.png"
            "images/games/icon/Milli Fortune-icon.png"
            "images/games/icon/Miri Kore-icon.png"
            "images/games/rogo/milikara-rogo.png"
            "images/games/rogo/Milli Fortune-rogo.png"
            "images/games/rogo/Miri Kore-rogo.png"
          )
          LEAK=0
          for f in "${WIP_FILES[@]}"; do
            if git diff --name-only origin/main...HEAD | grep -Fq "$f"; then
              echo "::error::WIP file leaked to main: $f"
              LEAK=1
            fi
          done
          # Check script.js for devOnly leakage (devOnly should be removed before merging to main)
          if git diff origin/main...HEAD -- script.js | grep -q "devOnly.*true"; then
            echo "::error::script.js still contains devOnly:true - remove devOnly before merging to main"
            LEAK=1
          fi
          # Check firebase-config.js for unexpected real key addition (already public, but warn)
          if git diff origin/main...HEAD -- firebase-config.js | grep -q "AIzaSy"; then
            echo "::warning::firebase-config.js contains API key - ensure intentional"
          fi
          if [ $LEAK -eq 1 ]; then
            echo "Guard failed: WIP leakage detected"
            exit 1
          fi
          echo "Guard passed: no WIP leakage"
