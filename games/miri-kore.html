<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>みりこれ！ - Milli Games</title>
    <meta property="og:title" content="みりこれ！">
    <meta property="og:description" content="お題と同じカードを見つけ出せ！たくさん並んだカードの中から、お題とまったく同じイラストをタップ。進むほどカードが増えて、違いも見つけにくくなる…！">
    <meta property="og:image" content="https://milli-games.onrender.com/images/ogp.png">
    <meta property="og:url" content="https://milli-games.onrender.com/games/miri-kore.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Milli Games">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="../images/icon/favicon.ico" sizes="any">
    <link rel="icon" href="../images/icon/192.png" sizes="192x192" type="image/png">
    <link rel="icon" href="../images/games/icon/Miri Kore-icon.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="../images/icon/192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="../images/icon/518.png" sizes="518x518">
    <link rel="stylesheet" href="../cursor.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f0ebf5, #e4d6ed, #d8c4e5);
            color: #2d1b4e;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 0 16px; height: 52px;
            display: flex; align-items: center;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.5);
            flex-shrink: 0;
        }
        header a { display: flex; align-items: center; text-decoration: none; }
        .header-logo { height: 28px; width: auto; display: block; }
        .game-logo { height: 36px; width: auto; vertical-align: middle; margin-left: 12px; }

        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 10px 10px;
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .screen { display: none; width: 100%; flex-direction: column; align-items: center; }
        .screen.active { display: flex; }

        /* ===== スタート画面 ===== */
        .start-title {
            font-size: 2.2rem; font-weight: 800;
            margin: 8px 0 2px;
            background: linear-gradient(135deg, #8582fb, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .start-sub {
            font-size: 0.8rem; color: rgba(45,27,78,0.5);
            margin-bottom: 20px; text-align: center; line-height: 1.6;
        }
        .mode-btn {
            width: 100%; max-width: 340px;
            padding: 14px 20px; margin: 8px 0;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 14px;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #2d1b4e;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            -webkit-tap-highlight-color: transparent;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.4); transform: translateY(-1px); }
        .mode-btn:active { transform: scale(0.97); }
        .mode-btn .mode-name { font-size: 1.15rem; font-weight: 800; display: block; }
        .mode-btn .mode-desc { font-size: 0.78rem; color: rgba(45,27,78,0.55); line-height: 1.5; display: block; margin-top: 2px; }
        .mode-btn .mode-best { font-size: 0.72rem; color: #8582fb; font-weight: 700; display: block; margin-top: 4px; }
        .howto {
            margin-top: 22px; padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            background: rgba(255,255,255,0.18);
            max-width: 340px; width: 100%;
            font-size: 0.75rem; color: rgba(45,27,78,0.6);
            line-height: 1.7;
        }
        .howto b { color: #2d1b4e; }

        /* ===== ゲーム画面 ===== */
        .top-bar {
            width: 100%;
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-bottom: 6px; flex-shrink: 0;
        }
        .stat-box {
            display: flex; gap: 6px; flex-wrap: wrap;
        }
        .stat-item {
            background: rgba(45,27,78,0.08);
            border-radius: 8px;
            padding: 4px 10px;
            text-align: center;
            min-width: 58px;
        }
        .stat-item .label {
            font-size: 0.6rem; font-weight: 600;
            color: rgba(45,27,78,0.5);
            letter-spacing: 0.05em;
            line-height: 1.2;
        }
        .stat-item .value {
            font-size: 1.05rem; font-weight: 800;
            color: #2d1b4e;
            line-height: 1.3;
        }
        .stat-item .value.timer-low { color: #ef4444; animation: pulse 0.6s ease infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        .target-area {
            display: flex; flex-direction: column; align-items: center;
            margin: 2px 0 8px; flex-shrink: 0;
        }
        .target-label {
            font-size: 0.72rem; font-weight: 700;
            color: rgba(45,27,78,0.55);
            letter-spacing: 0.2em;
            margin-bottom: 4px;
        }
        .target-frame {
            padding: 6px;
            background: rgba(255,255,255,0.5);
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(45,27,78,0.12);
            border: 2px solid rgba(133,130,251,0.6);
        }
        .target-frame canvas {
            width: 110px; height: 110px;
            display: block; border-radius: 10px;
        }
        .round-banner {
            font-size: 0.72rem; font-weight: 700; color: #8582fb;
            margin: 2px 0 8px; letter-spacing: 0.1em;
            flex-shrink: 0;
        }

        .options-grid {
            display: flex; flex-wrap: wrap;
            justify-content: center; align-items: center;
            gap: 10px;
            width: 100%;
            padding-bottom: 8px;
        }
        .card-btn {
            position: relative;
            border: none; padding: 0;
            background: rgba(255,255,255,0.45);
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(45,27,78,0.12);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        .card-btn canvas {
            width: 104px; height: 104px;
            display: block;
        }
        .card-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(45,27,78,0.2); }
        .card-btn:active { transform: scale(0.93); }
        .card-btn.flip-out { opacity: 0.25; transform: scale(0.9); pointer-events: none; }
        .card-btn.correct-flash {
            box-shadow: 0 0 0 3px #34d399, 0 0 24px rgba(52,211,153,0.6);
            transform: scale(1.06);
        }
        .card-btn.wrong-flash {
            animation: shake 0.4s ease;
            box-shadow: 0 0 0 3px #ef4444, 0 0 24px rgba(239,68,68,0.5);
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .combo-pop {
            position: absolute; top: -8px; right: -6px;
            background: linear-gradient(135deg, #ffd700, #ff6b6b);
            color: #fff; font-size: 0.72rem; font-weight: 800;
            padding: 2px 8px; border-radius: 20px;
            box-shadow: 0 2px 8px rgba(255,107,107,0.4);
            animation: popIn 0.25s ease;
            z-index: 5;
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            60% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        /* ===== 結果画面 ===== */
        .result-card {
            margin-top: 20px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.7);
            padding: 22px 26px;
            width: 100%; max-width: 320px;
            text-align: center;
            animation: fadeUp 0.35s ease;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .result-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; }
        .result-title.newbest { color: #8582fb; }
        .result-score { font-size: 2.4rem; font-weight: 800; margin: 6px 0 2px; }
        .result-rank {
            display: inline-block;
            font-size: 1.1rem; font-weight: 800;
            padding: 4px 18px; border-radius: 20px;
            margin: 6px 0 10px;
            color: #fff;
        }
        .rank-SS { background: linear-gradient(135deg, #ffd700, #ff6b6b); }
        .rank-S  { background: linear-gradient(135deg, #ffd700, #fbbf24); }
        .rank-A  { background: linear-gradient(135deg, #a855f7, #8582fb); }
        .rank-B  { background: linear-gradient(135deg, #60a5fa, #38bdf8); }
        .rank-C  { background: linear-gradient(135deg, #94a3b8, #cbd5e1); }
        .result-stats {
            font-size: 0.8rem; color: rgba(45,27,78,0.6);
            line-height: 1.8; margin-bottom: 14px;
        }
        .result-buttons { display: flex; gap: 10px; justify-content: center; }
        .btn {
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 10px;
            background: rgba(255,255,255,0.3);
            color: #2d1b4e;
            font-size: 0.85rem; font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:hover { background: rgba(255,255,255,0.5); }
        .btn:active { transform: scale(0.95); }
        .btn-primary {
            background: linear-gradient(135deg, #8582fb, #716ed5);
            border-color: transparent; color: #fff;
            box-shadow: 0 4px 16px rgba(133,130,251,0.25);
        }
        .btn-primary:hover { background: linear-gradient(135deg, #8582fb, #716ed5); opacity: 0.9; }

        /* ===== ローディング ===== */
        .loading-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, #f0ebf5, #e4d6ed, #d8c4e5);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 24px;
            transition: opacity 0.4s ease;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(133,130,251,0.2);
            border-top-color: #8582fb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            font-size: 1.1rem; font-weight: 700;
            color: #2d1b4e; letter-spacing: 0.15em;
        }

        @media (max-width: 420px) {
            header { height: 44px; padding: 0 12px; }
            .header-logo { height: 24px; }
            .game-container { padding: 50px 6px 6px; }
            .target-frame canvas { width: 96px; height: 96px; }
            .card-btn canvas { width: 92px; height: 92px; }
            .options-grid { gap: 8px; }
            .start-title { font-size: 1.8rem; }
            .result-card { padding: 18px 20px; }
        }
    </style>
</head>
<body>
    <!-- ローディング画面 -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">NOW LOADING</div>
    </div>

    <header id="top-bar">
        <a href="../index.html"><img src="../images/rogo.png" alt="Milli Games" class="header-logo"></a>
        <img src="../images/games/rogo/Miri Kore-rogo.png" alt="みりこれ！" class="game-logo">
    </header>

    <div class="game-container">

        <!-- スタート画面 -->
        <div id="start-screen" class="screen active">
            <div class="start-title">みりこれ！</div>
            <div class="start-sub">お題と同じカードを、見つけ出せ！</div>

            <button class="mode-btn" id="btn-normal">
                <span class="mode-name">ノーマル</span>
                <span class="mode-desc">ミスするまでどこまでも。進むほどカードが増えて難しくなる！</span>
                <span class="mode-best" id="best-normal">ベスト: -</span>
            </button>
            <button class="mode-btn" id="btn-ta">
                <span class="mode-name">タイムアタック</span>
                <span class="mode-desc">60秒で何問正解できるか！ミスで時間が減るぞ！</span>
                <span class="mode-best" id="best-ta">ベスト: -</span>
            </button>

            <div class="howto">
                <b>あそびかた</b><br>
                上に表示される「お題」カードと<b>まったく同じ</b>カードを、並んでいるカードの中からタップ！<br>
                進むほどカードが増えて、違いもわかりにくくなっていく…！
            </div>
        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen" class="screen">
            <div class="top-bar">
                <div class="stat-box">
                    <div class="stat-item">
                        <div class="label" id="stat-label-1">ラウンド</div>
                        <div class="value" id="stat-value-1">1</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">スコア</div>
                        <div class="value" id="stat-score">0</div>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-item">
                        <div class="label">コンボ</div>
                        <div class="value" id="stat-combo">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="label" id="stat-label-2">ベスト</div>
                        <div class="value" id="stat-best">0</div>
                    </div>
                </div>
            </div>

            <div class="round-banner" id="round-banner">ROUND 1</div>

            <div class="target-area">
                <div class="target-label">お 題</div>
                <div class="target-frame">
                    <canvas id="target-canvas" width="160" height="160"></canvas>
                </div>
            </div>

            <div class="options-grid" id="options-grid"></div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="screen">
            <div class="result-card">
                <div class="result-title" id="result-title">ゲームオーバー</div>
                <div class="result-score" id="result-score">0</div>
                <div class="result-rank" id="result-rank"></div>
                <div class="result-stats" id="result-stats"></div>
                <div class="result-buttons">
                    <button class="btn btn-primary" id="btn-retry">もう一度</button>
                    <button class="btn" id="btn-back">モード選択</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        (function () {
            "use strict";

            /* ============================================
             * 共通設定
             * ============================================ */
            var GAME_NAME = "みりこれ！";
            var GAME_ID = "miri-kore";
            var MODE_NORMAL = "normal";
            var MODE_TA = "ta";
            var TA_TIME = 60;        // タイムアタックの制限時間（秒）
            var TA_PENALTY = 3;      // タイムアタックでミスした時の減点（秒）
            var SCORE_PER_CORRECT = 100;
            var MAX_CARDS = 9;       // カード枚数の上限

            /* ★★★ 後で本物のイラストを入れる場所 ★★★
             * 例: var CARD_IMAGES = ["images/games/miri-kore/illust-01.png", ...];
             * 入れると、仮のCanvasイラストの代わりに画像が使われます。
             * 空の間はCanvasで自動生成された仮イラストで遊べます。 */
            var CARD_IMAGES = [];

            /* ============================================
             * 状態
             * ============================================ */
            var mode = MODE_NORMAL;
            var running = false;
            var round = 0;           // 次のラウンド番号（1始まり）
            var correctCount = 0;
            var combo = 0;
            var maxCombo = 0;
            var score = 0;
            var timeLeft = TA_TIME;
            var timerId = null;
            var currentCorrectIndex = -1;
            var locked = false;

            var el = {
                start: document.getElementById("start-screen"),
                game: document.getElementById("game-screen"),
                result: document.getElementById("result-screen"),
                statLabel1: document.getElementById("stat-label-1"),
                statValue1: document.getElementById("stat-value-1"),
                statLabel2: document.getElementById("stat-label-2"),
                statBest: document.getElementById("stat-best"),
                statScore: document.getElementById("stat-score"),
                statCombo: document.getElementById("stat-combo"),
                roundBanner: document.getElementById("round-banner"),
                targetCanvas: document.getElementById("target-canvas"),
                optionsGrid: document.getElementById("options-grid"),
                resultTitle: document.getElementById("result-title"),
                resultScore: document.getElementById("result-score"),
                resultRank: document.getElementById("result-rank"),
                resultStats: document.getElementById("result-stats"),
                btnNormal: document.getElementById("btn-normal"),
                btnTa: document.getElementById("btn-ta"),
                btnRetry: document.getElementById("btn-retry"),
                btnBack: document.getElementById("btn-back")
            };

            function showScreen(name) {
                el.start.classList.toggle("active", name === "start");
                el.game.classList.toggle("active", name === "game");
                el.result.classList.toggle("active", name === "result");
            }

            function bestKey() {
                return mode === MODE_TA ? "miriKore_best_ta" : "miriKore_best_normal";
            }
            function getBest() {
                try { return parseInt(localStorage.getItem(bestKey()) || "0", 10) || 0; } catch (e) { return 0; }
            }
            function setBest(v) {
                try { localStorage.setItem(bestKey(), String(v)); } catch (e) {}
            }

            /* ============================================
             * 仮イラスト生成（Canvas）
             * ・お題 = 完全な元イラスト
             * ・偽物 = 元イラストに「わずかな違い」を入れたもの
             * ============================================ */
            function mulberry32(a) {
                return function () {
                    a |= 0; a = a + 0x6D2B79F5 | 0;
                    var t = Math.imul(a ^ a >>> 15, 1 | a);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }

            var PALETTE = ["#ff6b6b", "#ffd93d", "#6bcb77", "#4d96ff", "#a855f7", "#f472b6", "#fb923c", "#34d399", "#60a5fa"];

            function hexToHsl(hex) {
                var r = parseInt(hex.slice(1, 3), 16) / 255;
                var g = parseInt(hex.slice(3, 5), 16) / 255;
                var b = parseInt(hex.slice(5, 7), 16) / 255;
                var max = Math.max(r, g, b), min = Math.min(r, g, b);
                var h = 0, s = 0, l = (max + min) / 2;
                if (max !== min) {
                    var d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
                    else if (max === g) h = (b - r) / d + 2;
                    else h = (r - g) / d + 4;
                    h *= 60;
                }
                return { h: h, s: s, l: l };
            }
            function hslToHex(h, s, l) {
                h = ((h % 360) + 360) % 360;
                var c = (1 - Math.abs(2 * l - 1)) * s;
                var x = c * (1 - Math.abs((h / 60) % 2 - 1));
                var m = l - c / 2;
                var r = 0, g = 0, b = 0;
                if (h < 60) { r = c; g = x; }
                else if (h < 120) { r = x; g = c; }
                else if (h < 180) { g = c; b = x; }
                else if (h < 240) { g = x; b = c; }
                else if (h < 300) { r = x; b = c; }
                else { r = c; b = x; }
                function to(v) { return Math.round((v + m) * 255).toString(16).padStart(2, "0"); }
                return "#" + to(r) + to(g) + to(b);
            }
            function shiftHue(hex, deg) {
                var hsl = hexToHsl(hex);
                return hslToHex(hsl.h + deg, hsl.s, hsl.l);
            }

            function randomSpec(rnd) {
                var c1 = PALETTE[Math.floor(rnd() * PALETTE.length)];
                var c2 = shiftHue(c1, 30 + Math.floor(rnd() * 60));
                var subColors = [PALETTE[Math.floor(rnd() * PALETTE.length)], PALETTE[Math.floor(rnd() * PALETTE.length)]];
                return {
                    bg1: c1,
                    bg2: c2,
                    main: {
                        x: 60 + Math.floor(rnd() * 40),
                        y: 55 + Math.floor(rnd() * 40),
                        r: 26 + Math.floor(rnd() * 12),
                        color: subColors[0],
                        type: "circle"
                    },
                    sub: {
                        x: 55 + Math.floor(rnd() * 50),
                        y: 55 + Math.floor(rnd() * 50),
                        r: 9 + Math.floor(rnd() * 7),
                        color: subColors[1],
                        type: ["square", "triangle", "star"][Math.floor(rnd() * 3)],
                        rot: 0
                    },
                    dots: (function () {
                        var n = 1 + Math.floor(rnd() * 2);
                        var arr = [];
                        for (var i = 0; i < n; i++) {
                            arr.push({
                                x: 15 + Math.floor(rnd() * 130),
                                y: 15 + Math.floor(rnd() * 130),
                                r: 3 + Math.floor(rnd() * 3),
                                color: PALETTE[Math.floor(rnd() * PALETTE.length)]
                            });
                        }
                        return arr;
                    })()
                };
            }

            // 難易度に応じた「偽物の違い」を作る
            // tier 1: 大きめの違いを2つ / tier 2: 中くらいの違い / tier 3: ごく小さな違い
            function makeFake(base, rnd) {
                var tier = difficultyTier(round);
                var spec = JSON.parse(JSON.stringify(base));
                var diffs = [];
                var maxDiff = tier === 1 ? 2 : 1;

                while (diffs.length < maxDiff) {
                    var pick = Math.floor(rnd() * 8);
                    if (diffs.indexOf(pick) >= 0) continue;
                    var applied = true;
                    switch (pick) {
                        case 0: // メインの色をずらす
                            spec.main.color = shiftHue(spec.main.color, tier === 1 ? 40 + Math.floor(rnd() * 40) : tier === 2 ? 18 + Math.floor(rnd() * 14) : 8 + Math.floor(rnd() * 6));
                            break;
                        case 1: // サブ図形を消す（tier1のみ）
                            if (tier !== 1 || !spec.sub) { applied = false; break; }
                            spec.sub = null;
                            break;
                        case 2: // サブ図形の位置をずらす
                            if (!spec.sub) { applied = false; break; }
                            var m = tier === 1 ? 20 : tier === 2 ? 10 : 4;
                            spec.sub.x += (rnd() < 0.5 ? -1 : 1) * (m + Math.floor(rnd() * m));
                            spec.sub.y += (rnd() < 0.5 ? -1 : 1) * (m + Math.floor(rnd() * m));
                            spec.sub.x = Math.max(18, Math.min(142, spec.sub.x));
                            spec.sub.y = Math.max(18, Math.min(142, spec.sub.y));
                            break;
                        case 3: // サブ図形の色をずらす
                            if (!spec.sub) { applied = false; break; }
                            spec.sub.color = shiftHue(spec.sub.color, tier === 1 ? 50 + Math.floor(rnd() * 50) : tier === 2 ? 20 + Math.floor(rnd() * 15) : 9 + Math.floor(rnd() * 6));
                            break;
                        case 4: // サブ図形を回転させる（90/180/270度）
                            if (!spec.sub || spec.sub.type === "square") { applied = false; break; }
                            spec.sub.rot = 90 + Math.floor(rnd() * 3) * 90;
                            break;
                        case 5: // ドットの位置をずらす
                            if (!spec.dots.length) { applied = false; break; }
                            var d = spec.dots[Math.floor(rnd() * spec.dots.length)];
                            var dm = tier === 1 ? 14 : tier === 2 ? 7 : 3;
                            d.x += (rnd() < 0.5 ? -1 : 1) * (dm + Math.floor(rnd() * dm));
                            d.y += (rnd() < 0.5 ? -1 : 1) * (dm + Math.floor(rnd() * dm));
                            d.x = Math.max(8, Math.min(152, d.x));
                            d.y = Math.max(8, Math.min(152, d.y));
                            break;
                        case 6: // サブ図形のサイズを変える
                            if (!spec.sub) { applied = false; break; }
                            if (tier === 1) {
                                spec.sub.r = Math.max(6, spec.sub.r * (rnd() < 0.5 ? 0.6 : 1.4));
                            } else {
                                spec.sub.r = spec.sub.r * (tier === 2 ? (0.8 + rnd() * 0.15) : (0.9 + rnd() * 0.08));
                            }
                            break;
                        case 7: // 背景の色相をずらす
                            var bdeg = tier === 1 ? 30 + Math.floor(rnd() * 30) : tier === 2 ? 12 + Math.floor(rnd() * 10) : 5 + Math.floor(rnd() * 5);
                            spec.bg1 = shiftHue(spec.bg1, bdeg);
                            spec.bg2 = shiftHue(spec.bg2, bdeg);
                            break;
                    }
                    if (applied) diffs.push(pick);
                }
                return spec;
            }

            function difficultyTier(r) {
                if (r <= 2) return 1;
                if (r <= 6) return 2;
                return 3;
            }

            function cardCountFor(progress) {
                // progress: ノーマル=ラウンド / TA=正解数
                return Math.min(3 + Math.floor((progress - 1) / 2), MAX_CARDS);
            }

            /* ============================================
             * イラスト描画
             * ============================================ */
            function drawShape(ctx, shape, x, y, r, color, rot) {
                ctx.fillStyle = color;
                ctx.save();
                ctx.translate(x, y);
                if (rot) ctx.rotate(rot * Math.PI / 180);
                if (shape === "circle") {
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
                } else if (shape === "square") {
                    ctx.fillRect(-r, -r, r * 2, r * 2);
                } else if (shape === "triangle") {
                    ctx.beginPath();
                    ctx.moveTo(0, -r);
                    ctx.lineTo(r, r);
                    ctx.lineTo(-r, r);
                    ctx.closePath(); ctx.fill();
                } else if (shape === "star") {
                    ctx.beginPath();
                    for (var i = 0; i < 10; i++) {
                        var rad = i % 2 === 0 ? r : r * 0.45;
                        var a = (i * 36 - 90) * Math.PI / 180;
                        ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
                    }
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }

            function drawSpec(canvas, spec) {
                var ctx = canvas.getContext("2d");
                var w = canvas.width, h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                // 背景グラデーション
                var grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, spec.bg1);
                grad.addColorStop(1, spec.bg2);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // ドット
                for (var i = 0; i < spec.dots.length; i++) {
                    var d = spec.dots[i];
                    drawShape(ctx, "circle", d.x, d.y, d.r, d.color, 0);
                }
                // メイン図形
                drawShape(ctx, spec.main.type, spec.main.x, spec.main.y, spec.main.r, spec.main.color, 0);
                // サブ図形
                if (spec.sub) {
                    drawShape(ctx, spec.sub.type, spec.sub.x, spec.sub.y, spec.sub.r, spec.sub.color, spec.sub.rot || 0);
                }
            }

            // カードの見た目を描く（CARD_IMAGES が設定されていれば画像を使う）
            function renderCard(canvas, spec) {
                if (CARD_IMAGES.length && spec.imgIndex !== undefined) {
                    var ctx = canvas.getContext("2d");
                    var img = new Image();
                    img.onload = function () {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                    img.src = CARD_IMAGES[spec.imgIndex];
                } else {
                    drawSpec(canvas, spec);
                }
            }

            /* ============================================
             * ラウンド進行
             * ============================================ */
            function nextRound() {
                locked = false;
                var progress = mode === MODE_TA ? correctCount + 1 : round;
                var count = cardCountFor(progress);
                var rnd = mulberry32(Date.now() & 0xffffffff);
                var base = randomSpec(rnd);

                // 偽物カードを生成（お互いに同じにならないように）
                var fakes = [];
                var tries = 0;
                while (fakes.length < count - 1 && tries < 200) {
                    tries++;
                    var fake = makeFake(base, rnd);
                    var json = JSON.stringify(fake);
                    var dup = false;
                    for (var i = 0; i < fakes.length; i++) {
                        if (JSON.stringify(fakes[i]) === json) { dup = true; break; }
                    }
                    if (!dup) fakes.push(fake);
                }

                // 正解の位置をランダムに決めてシャッフル
                var cards = [];
                for (var j = 0; j < fakes.length; j++) cards.push(fakes[j]);
                cards.push(JSON.parse(JSON.stringify(base)));
                for (var k = cards.length - 1; k > 0; k--) {
                    var m = Math.floor(rnd() * (k + 1));
                    var tmp = cards[k]; cards[k] = cards[m]; cards[m] = tmp;
                }
                currentCorrectIndex = cards.length - 1;
                for (var n = 0; n < cards.length; n++) {
                    if (JSON.stringify(cards[n]) === JSON.stringify(base)) { currentCorrectIndex = n; break; }
                }

                // 表示更新
                renderCard(el.targetCanvas, base);
                el.optionsGrid.innerHTML = "";
                for (var c = 0; c < cards.length; c++) {
                    (function (spec, idx) {
                        var btn = document.createElement("button");
                        btn.className = "card-btn";
                        btn.type = "button";
                        var cv = document.createElement("canvas");
                        cv.width = 160; cv.height = 160;
                        renderCard(cv, spec);
                        btn.appendChild(cv);
                        btn.addEventListener("click", function () { onPick(btn, idx); });
                        el.optionsGrid.appendChild(btn);
                    })(cards[c], c);
                }
                el.optionsGrid.style.maxWidth = (count * 104 + (count - 1) * 10) + "px";
            }

            function updateHud() {
                el.statValue1.textContent = mode === MODE_TA ? timeLeft : round;
                el.statScore.textContent = score.toLocaleString();
                el.statCombo.textContent = combo;
                el.statBest.textContent = getBest().toLocaleString();
                el.roundBanner.textContent = mode === MODE_TA
                    ? (correctCount + 1) + " 問目"
                    : "ROUND " + round;
                var timerEl = el.statValue1;
                timerEl.classList.toggle("timer-low", mode === MODE_TA && timeLeft <= 10);
            }

            function onPick(btn, idx) {
                if (!running || locked) return;
                locked = true;
                var correct = idx === currentCorrectIndex;
                if (correct) {
                    btn.classList.add("correct-flash");
                    combo++;
                    if (combo > maxCombo) maxCombo = combo;
                    score += SCORE_PER_CORRECT;
                    if (combo > 1 && combo % 5 === 0) {
                        var pop = document.createElement("span");
                        pop.className = "combo-pop";
                        pop.textContent = combo + " COMBO!";
                        btn.appendChild(pop);
                    }
                    correctCount++;
                    if (mode === MODE_NORMAL) round++;
                    updateHud();
                    setTimeout(nextRound, 420);
                } else {
                    combo = 0;
                    btn.classList.add("wrong-flash");
                    if (mode === MODE_TA) {
                        timeLeft = Math.max(0, timeLeft - TA_PENALTY);
                        updateHud();
                        setTimeout(nextRound, 500);
                    } else {
                        setTimeout(endGame, 500);
                    }
                }
            }

            /* ============================================
             * タイマー（タイムアタック）
             * ============================================ */
            function startTimer() {
                stopTimer();
                timerId = setInterval(function () {
                    timeLeft--;
                    updateHud();
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }, 1000);
            }
            function stopTimer() {
                if (timerId) { clearInterval(timerId); timerId = null; }
            }

            /* ============================================
             * ゲーム開始 / 終了
             * ============================================ */
            function startGame(m) {
                mode = m;
                running = true;
                round = 1;
                correctCount = 0;
                combo = 0;
                maxCombo = 0;
                score = 0;
                timeLeft = TA_TIME;

                el.statLabel1.textContent = mode === MODE_TA ? "残り時間" : "ラウンド";
                el.statLabel2.textContent = "ベスト";
                showScreen("game");
                updateHud();
                nextRound();
                if (mode === MODE_TA) startTimer();
            }

            function rankFor(score) {
                if (score >= 2000) return "SS";
                if (score >= 1500) return "S";
                if (score >= 1000) return "A";
                if (score >= 600) return "B";
                return "C";
            }

            function endGame() {
                if (!running) return;
                running = false;
                stopTimer();
                var best = getBest();
                var isNewBest = score > best;
                if (isNewBest) setBest(score);

                var rank = rankFor(score);
                el.resultTitle.textContent = isNewBest ? "NEW BEST!" : (mode === MODE_TA ? "タイムアップ！" : "ゲームオーバー");
                el.resultTitle.classList.toggle("newbest", isNewBest);
                el.resultScore.textContent = score.toLocaleString();
                el.resultRank.textContent = "RANK " + rank;
                el.resultRank.className = "result-rank rank-" + rank;
                el.resultStats.innerHTML =
                    "スコア: " + score.toLocaleString() + " pt<br>" +
                    "正解: " + correctCount + " 問　最大コンボ: " + maxCombo + "<br>" +
                    (mode === MODE_TA ? "残り時間: " + Math.max(0, timeLeft) + " 秒<br>" : "到達ラウンド: " + round + "<br>") +
                    (isNewBest ? '<b style="color:#8582fb">ベスト更新!!</b>' : "ベスト: " + best.toLocaleString());
                showScreen("result");

                // プレイ履歴に記録（本番の「プレイ履歴」に表示される）
                saveHistory({
                    score: score,
                    clear: false,
                    type: mode === MODE_TA ? "タイムアタック" : "ノーマル",
                    rank: rank
                });
            }

            /* ============================================
             * 履歴の保存（TEMPLATE と同様の実装）
             * ============================================ */
            function saveHistory(data) {
                try {
                    var h = JSON.parse(localStorage.getItem("milliGames_history") || "[]");
                    var entry = { game: GAME_NAME, date: new Date().toISOString() };
                    for (var k in data) entry[k] = data[k];
                    h.unshift(entry);
                    if (h.length > 50) h = h.slice(0, 50);
                    localStorage.setItem("milliGames_history", JSON.stringify(h));
                } catch (e) {}
                recordGameClear(GAME_ID, data.score || 0);
            }

            /* ============================================
             * イベント登録
             * ============================================ */
            el.btnNormal.addEventListener("click", function () { startGame(MODE_NORMAL); });
            el.btnTa.addEventListener("click", function () { startGame(MODE_TA); });
            el.btnRetry.addEventListener("click", function () { startGame(mode); });
            el.btnBack.addEventListener("click", function () {
                stopTimer();
                running = false;
                document.getElementById("best-normal").textContent = "ベスト: " + getBestFor(MODE_NORMAL).toLocaleString();
                document.getElementById("best-ta").textContent = "ベスト: " + getBestFor(MODE_TA).toLocaleString();
                showScreen("start");
            });

            function getBestFor(m) {
                try {
                    return parseInt(localStorage.getItem(m === MODE_TA ? "miriKore_best_ta" : "miriKore_best_normal") || "0", 10) || 0;
                } catch (e) { return 0; }
            }

            // ローディングを閉じる
            window.addEventListener("load", function () {
                document.getElementById("best-normal").textContent = "ベスト: " + getBestFor(MODE_NORMAL).toLocaleString();
                document.getElementById("best-ta").textContent = "ベスト: " + getBestFor(MODE_TA).toLocaleString();
                setTimeout(function () {
                    document.getElementById("loading-overlay").classList.add("hidden");
                }, 300);
            });
        })();
    </script>
